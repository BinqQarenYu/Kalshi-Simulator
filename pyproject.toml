[project]
name = "kalshi-sim"
version = "0.1.0"
description = "Kalshi BTC Demo Data Ingestion Agent — L2 CLOB WebSocket Pipeline"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "cryptography>=42,<44",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.5,<3",
    "orjson>=3.9,<4",
    "numpy>=1.26",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_sim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
