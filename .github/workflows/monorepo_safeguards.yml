name: Agent Firewall Enforcer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  enforce-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v42

      - name: Verify Agent Isolation
        run: |
          APP1_TOUCHED=0
          APP2_TOUCHED=0
          APP3_TOUCHED=0
          SHARED_TOUCHED=0

          # Check which directories contain modified files
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $file == app_1_machine_engine/* ]]; then
              APP1_TOUCHED=1
            elif [[ $file == app_2_execution_bot/* ]]; then
              APP2_TOUCHED=1
            elif [[ $file == app_3_autonomous_chef/* ]]; then
              APP3_TOUCHED=1
            elif [[ $file == shared/* ]]; then
              SHARED_TOUCHED=1
            fi
          done

          TOTAL_TOUCHED=$((APP1_TOUCHED + APP2_TOUCHED + APP3_TOUCHED))
          ACTOR="${{ github.actor }}"
          
          # Isolate logic by actor type (catch bots, Jules, Choppingblock, etc.)
          if [[ "$ACTOR" == *"[bot]"* || "$ACTOR" == *"agent"* || "$ACTOR" == *"choppingblock"* ]]; then
            
            # RULE 1: Forbid modification of the /shared directory
            if [ "$SHARED_TOUCHED" -eq 1 ]; then
              echo "::error::SHARED FOLDER BREACH DETECTED!"
              echo "::error::The agent '$ACTOR' is attempting to modify the /shared/ directory."
              echo "::error::Automated agents are strictly read-only for shared data schemas to prevent catastrophic downstream failures."
              exit 1
            fi

            # RULE 2: Forbid cross-app modifications in a single PR
            if [ "$TOTAL_TOUCHED" -gt 1 ]; then
              echo "::error::FIREWALL BREACH DETECTED!"
              echo "::error::The agent '$ACTOR' is attempting to modify $TOTAL_TOUCHED isolated applications simultaneously."
              exit 1
            fi
          fi
          
          echo "Firewall check passed. Agent scoping and shared folder integrity are valid."
