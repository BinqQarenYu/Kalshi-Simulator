name: Agent Firewall Enforcer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  enforce-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v42

      - name: Verify Agent Isolation
        run: |
          APP1_TOUCHED=0
          APP2_TOUCHED=0
          APP3_TOUCHED=0

          # Check which directories contain modified files
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $file == app_1_machine_engine/* ]]; then
              APP1_TOUCHED=1
            elif [[ $file == app_2_execution_bot/* ]]; then
              APP2_TOUCHED=1
            elif [[ $file == app_3_autonomous_chef/* ]]; then
              APP3_TOUCHED=1
            fi
          done

          # Count how many distinct app directories are in this PR
          TOTAL_TOUCHED=$((APP1_TOUCHED + APP2_TOUCHED + APP3_TOUCHED))
          
          # We isolate logic by actor type, catching any bot or automated agent 
          # (e.g., github-actions[bot], jules-agent, dependabot)
          ACTOR="${{ github.actor }}"
          
          if [[ "$ACTOR" == *"[bot]"* || "$ACTOR" == *"agent"* || "$ACTOR" == *"choppingblock"* ]]; then
            if [ "$TOTAL_TOUCHED" -gt 1 ]; then
              echo "::error::FIREWALL BREACH DETECTED!"
              echo "::error::The agent '$ACTOR' is attempting to modify $TOTAL_TOUCHED isolated applications in a single Pull Request."
              echo "::error::To prevent cross-contamination and hallucinated dependencies, automated agents must submit separate PRs for app_1, app_2, and app_3."
              exit 1
            fi
          fi
          
          echo "Firewall check passed. Agent scoping is valid."
